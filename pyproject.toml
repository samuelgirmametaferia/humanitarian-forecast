[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanitarian-forecast"
version = "0.1.0"
description = "Structured humanitarian conflict-risk and next-location forecasting pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "torch>=2.6",
  "scikit-learn>=1.9",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
geo = ["rasterio>=1.4", "shapely>=2.0", "pyproj>=3.7", "pyogrio>=0.11"]

[project.scripts]
humanitarian-forecast = "humanitarian_forecast.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanitarian_forecast = ["web/templates/*.html"]
