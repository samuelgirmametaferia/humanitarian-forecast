[project]
name = "humanitarian-forecaster-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "numpy==2.5.2",
  "onnxruntime==1.30.0",
  "pydantic==2.13.5",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
production = [
  "psycopg[binary]==3.3.5",
]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.7",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = [".", "../src"]
testpaths = ["tests/backend"]
addopts = "-q"
